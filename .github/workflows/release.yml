# Push to main -> all tests -> (only if they pass) build, sign and publish a GitHub Release.
# The app checks the latest release once a day and offers it as an in-app update.
#
# A release is made only when versionName in app/build.gradle.kts is new (no tag v<versionName> yet),
# so ordinary pushes to main run the tests without publishing anything.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   HISAAB_RELEASE_KEYSTORE   base64 of hisaab-release.jks
#   HISAAB_KEYSTORE_PASSWORD  its password (same for store and key)
#   HISAAB_DEBUG_KEYSTORE     base64 of the original debug.keystore (signs the key-rotation proof)
#   HISAAB_KEY_LINEAGE        base64 of lineage.bin (debug key -> release key)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-configuration-cache :parser-core:test :shared:testDebugUnitTest :email:testDebugUnitTest :app:testDebugUnitTest
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  release:
    needs: test # nothing is published unless every test passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$name" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$name is already released; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Android SDK 37
        if: steps.version.outputs.exists == 'false'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Build release APK
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew --no-configuration-cache :app:assembleRelease

      - name: Sign with the Hisaab key (with the debug-key rotation proof)
        if: steps.version.outputs.exists == 'false'
        env:
          RELEASE_KEYSTORE: ${{ secrets.HISAAB_RELEASE_KEYSTORE }}
          DEBUG_KEYSTORE: ${{ secrets.HISAAB_DEBUG_KEYSTORE }}
          LINEAGE: ${{ secrets.HISAAB_KEY_LINEAGE }}
          PASSWORD: ${{ secrets.HISAAB_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$DEBUG_KEYSTORE" ] || [ -z "$LINEAGE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Signing secrets are missing; see the top of release.yml."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keys/debug.keystore"
          echo "$LINEAGE" | base64 -d > "$RUNNER_TEMP/keys/lineage.bin"
          out="Artha-${{ steps.version.outputs.name }}.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --rotation-min-sdk-version 28 --v4-signing-enabled false \
            --ks "$RUNNER_TEMP/keys/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer --ks "$RUNNER_TEMP/keys/release.jks" --ks-key-alias hisaab --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" \
            --lineage "$RUNNER_TEMP/keys/lineage.bin" --out "$out" app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$out" | grep "Signer"
          rm -rf "$RUNNER_TEMP/keys"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "Artha ${{ steps.version.outputs.name }}"
            echo
            git log --pretty='- %s' "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD | head -30
            echo
            echo "sha256: $sha"
          } > notes.md
          gh release create "v${{ steps.version.outputs.name }}" "$APK" --title "Artha ${{ steps.version.outputs.name }}" --notes-file notes.md
