# Every push and pull request: run all JVM test suites. Nothing is built for release here.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs the same tests in release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-configuration-cache :parser-core:test :shared:testDebugUnitTest :email:testDebugUnitTest :app:testDebugUnitTest

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
